<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logs · __TICKET_KEY__ · Abramad</title>
<style>
  :root {
    --bg-1: #0a1224;
    --bg-2: #0f1c33;
    --accent: #2f5fec;
    --accent-2: #22c55e;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --card-border: rgba(255, 255, 255, 0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at top, var(--bg-2), var(--bg-1));
    color: var(--text); padding: 48px 24px;
  }
  .container { max-width: 820px; margin: 0 auto; }

  .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--text-dim); text-decoration: none; margin-bottom: 24px;
    transition: color 0.15s ease;
  }
  .back-link:hover { color: var(--accent); }

  .brand {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 700; letter-spacing: 0.04em;
    color: var(--accent); margin-bottom: 14px;
  }
  .brand .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: inline-block;
  }

  h1 {
    font-size: 20px; margin: 0 0 4px; font-weight: 600;
    font-family: "SFMono-Regular", Consolas, monospace;
  }
  .subtitle { color: var(--text-dim); font-size: 13px; margin: 0 0 24px; }

  .log-box {
    background: #27385f;
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 20px;
    overflow-x: auto;
    max-height: 70vh;
    overflow-y: auto;
    box-shadow: inset 0 0 0 1px rgba(230, 230, 230, 0.02);
  }
  .log-box pre {
    margin: 0;
    font-family: "SFMono-Regular", Consolas, monospace;
    font-size: 13px;
    line-height: 1.6;
    color: #c9d6ea;
    white-space: pre-wrap;
    word-break: break-word;
    tab-size: 2;
}

  .log-time { color: var(--text-dim); }

  .lvl {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 1px 6px;
    border-radius: 4px;
  }
  .lvl-info  { color: #7dd3fc; background: rgba(56, 189, 248, 0.12); }
  .lvl-warn  { color: #fbbf24; background: rgba(251, 191, 36, 0.14); }
  .lvl-error { color: #fb7185; background: rgba(251, 113, 133, 0.14); }
  .lvl-debug { color: #a1a1aa; background: rgba(161, 161, 170, 0.14); }

  .footer { margin-top: 28px; text-align: center; font-size: 12px; color: var(--text-dim); }
  .footer .company { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
  <div class="container">
    <a class="back-link" href="../../index.html">&larr; Back to all reports</a>
    <div class="brand"><span class="dot"></span>ABRAMAD</div>
    <h1>__TICKET_KEY__</h1>
    <p class="subtitle">automation.log</p>
    <div class="log-box"><pre>
__LOG_CONTENT__
</pre></div>
    <div class="footer">Generated: __TIMESTAMP__ &middot; <span class="company">Abramad SysOps</span></div>
  </div>
</body>
</html>
