---
# Local_groups
admin_groups:
  - "{{ ad_info.ad_ou }}Deploy"
  - "{{ ad_info.ad_ou }}Support"
  - "Server_Administrators"
  - "{{ ad_info.ad_ou }}{{ inventory_hostname }}Members"

rdp_groups:
  - "{{ ad_info.ad_ou }}Members"


# Zabbix_Agent2
agent2_version: "7.0.30"

agent2_download_url: https://vnk-nexus.abramad.com/repository/zabbix-cdn/zabbix/binaries/stable/7.0/{{ agent2_version }}/zabbix_agent2-{{ agent2_version }}-windows-amd64-openssl.msi

agent2_temp_dir: C:\Temp\zabbix_agent2
agent2_install_dir: C:\Program Files\Zabbix Agent 2